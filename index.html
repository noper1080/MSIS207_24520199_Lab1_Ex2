<!DOCTYPE html>
<!-- Thuộc tính lang là bắt buộc cho trình đọc màn hình -->
<html lang="en">
<head>
  <!-- Chống lỗi font chữ quốc tế -->
  <meta charset="UTF-8">
  <!-- Bắt buộc để scale tỷ lệ 1:1 trên thiết bị di động -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Enterprise Developer Portfolio</title>
  
  <!-- Liên kết stylesheet bên ngoài -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Liên kết bỏ qua để tối ưu khả năng truy cập (A11y) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Khung ngữ nghĩa: Hạn chế tối đa dùng thẻ <div> -->
  <header role="banner">
    <h1>Jane Doe, Lead Engineer</h1> <!-- Chỉ dùng duy nhất 1 thẻ H1 -->
    <button id="theme-btn" aria-pressed="false">Toggle Theme</button>
  </header>

  <nav role="navigation" aria-label="Primary">
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
    </ul>
  </nav>

  <main id="main-content" role="main">
    <section id="about">
      <!-- Nội dung giới thiệu -->
    </section>
    
    <section id="projects">
      <!-- Khung chứa các thẻ dự án (Project Cards) -->
      <div class="project-grid">
         <!-- Card mẫu theo kiến trúc component -->
         <article class="project-card" data-category="frontend">
           <header class="card-header">
             <h3>Distributed State Engine</h3>
             <span class="badge">TypeScript</span>
           </header>
           <p>Lightweight event bus built without external libraries.</p>
           <footer class="card-footer">
             <a href="#" aria-label="View State Engine repository">Source Code</a>
           </footer>
         </article>
      </div>
    </section>
  </main>

  <!-- Liên kết JavaScript -->
  <script src="theme.js"></script>
</body>
</html>
